name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walletdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d walletdb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Match your .env.test keys
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: walletdb_test
      BLOCKCYPHER_TOKEN: ${{ secrets.BLOCKCYPHER_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --ci --runInBand

      - name: Run e2e tests
        run: npm run test:e2e